apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: photos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.3.0
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD
              value: immich
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-immich-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: photos
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
