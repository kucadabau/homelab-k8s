apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: photos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:release
          env:
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              value: immich
            - name: DB_PASSWORD
              value: immich
            - name: REDIS_HOSTNAME
              value: immich-redis
          volumeMounts:
            - name: ml-cache
              mountPath: /cache
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 2000m
      volumes:
        - name: ml-cache
          persistentVolumeClaim:
            claimName: pvc-immich-ml
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: photos
spec:
  selector:
    app: immich-machine-learning
  ports:
    - port: 3003
      targetPort: 3003
