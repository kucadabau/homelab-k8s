apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: photos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-immich-redis
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: photos
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
      targetPort: 6379
